<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Standalone taxi invoice PDF generator.">
  <meta name="theme-color" content="#1B5E20">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Taxi Invoice">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Taxi Invoice</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: #f7fbf7;
    }

    .app-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at center, rgba(255, 255, 255, 0.98) 0, rgba(247, 251, 247, 0.98) 62%, #e5efe6 100%);
      opacity: 1;
      transition: opacity 220ms ease;
    }

    .app-loading.loaded {
      opacity: 0;
      pointer-events: none;
    }

    .app-loading__content {
      display: grid;
      justify-items: center;
      gap: 18px;
      color: #1b5e20;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 20px;
      font-weight: 800;
    }

    .app-loading__icon {
      width: min(42vw, 172px);
      height: min(42vw, 172px);
      filter: drop-shadow(0 18px 26px rgba(0, 0, 0, 0.16));
    }

    .app-loading__bar {
      width: min(44vw, 184px);
      height: 6px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(27, 94, 32, 0.14);
    }

    .app-loading__bar::before {
      display: block;
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: #1b5e20;
      animation: app-loading-bar 1.1s ease-in-out infinite;
      content: "";
    }

    @keyframes app-loading-bar {
      0% {
        transform: translateX(-120%);
      }
      100% {
        transform: translateX(260%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .app-loading,
      .app-loading__bar::before {
        transition: none;
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div id="app-loading" class="app-loading" role="status" aria-label="Učitavanje aplikacije">
    <div class="app-loading__content">
      <img class="app-loading__icon" src="icons/Icon-192.png" alt="Taxi Invoice">
      <div>Taxi Invoice</div>
      <div class="app-loading__bar" aria-hidden="true"></div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('app-loading');
      if (!loading) {
        return;
      }
      loading.classList.add('loaded');
      window.setTimeout(function () {
        loading.remove();
      }, 260);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
