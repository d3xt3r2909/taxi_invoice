name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build web app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Validate Firebase secrets
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
        run: |
          missing=0
          for name in \
            FIREBASE_API_KEY \
            FIREBASE_PROJECT_ID \
            FIREBASE_MESSAGING_SENDER_ID \
            FIREBASE_DATABASE_URL \
            FIREBASE_AUTH_DOMAIN \
            FIREBASE_WEB_APP_ID
          do
            if [ -z "${!name}" ]; then
              echo "::error::$name secret is missing"
              missing=1
            fi
          done
          exit "$missing"

      - name: Resolve app version
        id: app_version
        run: |
          set -euo pipefail
          pubspec_version="$(sed -n 's/^version: *//p' pubspec.yaml | head -n 1)"
          if [ -z "$pubspec_version" ]; then
            echo "::error::pubspec.yaml version is missing"
            exit 1
          fi
          version_name="${pubspec_version%%+*}"
          build_number="${GITHUB_RUN_NUMBER}"
          commit_sha="${GITHUB_SHA::7}"
          built_at="$(date -u '+%Y-%m-%d %H:%M UTC')"

          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "built_at=$built_at" >> "$GITHUB_OUTPUT"

          echo "Building app version ${version_name}+${build_number} (${commit_sha})"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build web
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
          APP_VERSION_NAME: ${{ steps.app_version.outputs.version_name }}
          APP_BUILD_NUMBER: ${{ steps.app_version.outputs.build_number }}
          APP_COMMIT_SHA: ${{ steps.app_version.outputs.commit_sha }}
          APP_BUILT_AT: ${{ steps.app_version.outputs.built_at }}
        run: |
          flutter build web --release \
            --build-name="$APP_VERSION_NAME" \
            --build-number="$APP_BUILD_NUMBER" \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_DATABASE_URL="$FIREBASE_DATABASE_URL" \
            --dart-define=FIREBASE_AUTH_DOMAIN="$FIREBASE_AUTH_DOMAIN" \
            --dart-define=FIREBASE_WEB_APP_ID="$FIREBASE_WEB_APP_ID" \
            --dart-define=APP_VERSION_NAME="$APP_VERSION_NAME" \
            --dart-define=APP_BUILD_NUMBER="$APP_BUILD_NUMBER" \
            --dart-define=APP_COMMIT_SHA="$APP_COMMIT_SHA" \
            --dart-define=APP_BUILT_AT="$APP_BUILT_AT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    name: Deploy to Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
