name: app_taxi_invoice
description: Standalone taxi invoice PDF generator (no Klar dependencies).
version: 1.0.0+1
publish_to: "none"

environment:
  sdk: ^3.10.0
  flutter: ^3.38.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  file_picker: ^8.3.7
  intl: ^0.20.2
  path_provider: ^2.1.5
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^12.0.1
  uuid: ^4.5.2
  file_selector: ^1.1.0
  open_file: ^3.5.11
  shared_preferences: ^2.5.5
  path: ^1.9.1
  pointycastle: ^3.9.1
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  firebase_database: ^12.4.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/assistant_fab.png
    - assets/branding/home_header.png
    - assets/branding/login_background_panel.png
    - assets/branding/login_hero.png
    - assets/fonts/NotoSerif-Regular.ttf
    - assets/fonts/NotoSerif-Bold.ttf
